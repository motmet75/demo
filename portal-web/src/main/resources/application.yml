# Isolated public website process. No Redis, JPA, Vaadin, or admin sessions.
# Keep files under /opt/portal-live and the live server config unchanged.
server:
  address: "${PORTAL_WEB_BIND:127.0.0.1}"
  port: ${PORTAL_WEB_PORT:8083}
  forward-headers-strategy: framework
spring:
  thymeleaf:
    cache: false
  web:
    resources:
      add-mappings: false
portal:
  live:
    root: "${PORTAL_LIVE_ROOT:/opt/portal-live}"
  web:
    config-path: "${PORTAL_CONFIG_XML:/opt/tuonghoa/portal/xml/config.xml}"
    # Read-only fallback for original public theme fragments and shared assets.
    legacy-resources-root: "${PORTAL_LEGACY_RESOURCES_ROOT:/opt/tuonghoa/portal/src/main/resources}"
    content-bridge-url: "${PORTAL_WEB_BRIDGE_URL:http://127.0.0.1:8081/sapi/internal/portal-public}"
    content-bridge-token: "${PORTAL_WEB_BRIDGE_TOKEN:}"

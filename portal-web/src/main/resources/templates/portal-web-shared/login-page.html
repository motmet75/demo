<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title th:text="'Đăng nhập — ' + ${brandName}">Đăng nhập</title>
  <!-- Shared login form styles and script (username/password via /api/login-act, OTP, quick sign-up). -->
  <link href="/anhmedia.vn/css/login.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#eef2f6;color:#1f2933}
    .pw-auth{width:min(440px,100%);background:#fff;border:1px solid #dde3ea;border-radius:16px;padding:28px 24px;
      box-shadow:0 12px 32px rgba(15,23,42,.08)}
    .pw-auth__brand{display:block;text-align:center;font-weight:700;font-size:20px;color:#1f2933;text-decoration:none;margin-bottom:4px}
    .pw-auth__sub{text-align:center;color:#5b6775;margin:0 0 18px;font-size:14px}
    .pw-auth .wrapper{width:100%;max-width:none;padding:0;box-shadow:none;background:transparent}
    .pw-auth .login-container{margin-top:20px;text-align:center}
    .pw-auth .login-container>p{color:#5b6775;font-size:14px;margin:0 0 10px}
    .pw-auth .google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 14px;
      border:1px solid #dde3ea;border-radius:10px;background:#fff;color:#1f2933;text-decoration:none;font-weight:600}
    .pw-auth .google-btn img{width:18px;height:18px}
    .pw-auth .google-btn:hover{background:#f5f7fa}
    .social-login-error{color:#b42318;font-size:14px;margin-bottom:8px}
    .pw-auth__home{display:block;text-align:center;margin-top:18px;font-size:14px;color:#5b6775}
  </style>
</head>
<body>
<main class="pw-auth">
  <a class="pw-auth__brand" href="/" th:text="${brandName}">Trang chủ</a>
  <p class="pw-auth__sub" th:if="${session.username == null}">Đăng nhập để đặt hàng và theo dõi đơn hàng của bạn.</p>

  <div class="wrapper" th:if="${session.username == null}">
    <div class="title-text"><div class="title login">Đăng nhập</div><div class="title signup">Tạo tài khoản</div></div>
    <div class="form-container">
      <div class="slide-controls"><input type="radio" name="slide" id="login" checked><input type="radio" name="slide" id="signup"><label for="login" class="slide login">Đăng nhập</label><label for="signup" class="slide signup">Đăng ký nhanh</label><div class="slider-tab"></div></div>
      <div class="form-inner">
        <form id="loginForm" class="login">
          <div class="field"><input type="text" name="email" autocomplete="username" placeholder="Tên đăng nhập hoặc email" required></div>
          <div class="field"><input type="password" name="password" autocomplete="current-password" placeholder="Mật khẩu" required></div>
          <span class="error-message1" role="alert" style="display:none"></span>
          <div class="pass-link"><a href="/forgotpassword">Quên mật khẩu?</a></div>
          <div class="field btn"><input type="button" class="btn-layer-login" value="Đăng nhập"></div>
          <div class="signup-link">Chưa có tài khoản? <a href="">Đăng ký nhanh bằng email</a></div>
        </form>
        <form id="sinupForm" class="signup">
          <a href="/register">Đăng ký với username tự chọn</a>
          <div class="field"><input type="text" name="email" autocomplete="email" placeholder="Email" required></div>
          <input type="hidden" name="loginform" value="simple">
          <div class="field"><input type="password" name="password" autocomplete="new-password" placeholder="Mật khẩu" required></div>
          <div class="field"><input type="password" name="repassword" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required></div>
          <span class="error-message" role="alert" style="display:none"></span>
          <div class="field btn"><div class="btn-layer"></div><input type="submit" class="btn-layer-signup" value="Đăng ký"></div>
        </form>
      </div>
    </div>

    <div class="login-container">
      <p>Hoặc</p>
      <div class="social-login-error" role="alert" th:if="${param.social != null and param.error != null}">Không thể đăng nhập bằng Google. Vui lòng thử lại.</div>
      <a href="/oauth2/authorization/google" class="google-btn"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt=""><span>Tiếp tục với Google</span></a>
    </div>
  </div>

  <div th:replace="mfa-setup :: mfaSetup"></div>
  <div th:replace="mfa-verify :: mfaVerify"></div>

  <a class="pw-auth__home" href="/">← Về trang chủ</a>
</main>
<script src="/anhmedia.vn/js/login.js?v=20260817-2"></script>
</body>
</html>

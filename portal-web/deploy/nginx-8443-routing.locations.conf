# Nginx route fragment for the EXISTING SSL server block (listen 8443).
# DO NOT paste this as a separate server{} or include it alongside existing
# duplicate location /, /sapi/, /bom-inventory/ blocks.
# Keep current SSL certificates, 443 frontend listener/proxy, redirects,
# client_max_body_size, timeout settings and other hosts untouched.
#
# Prerequisites before using:
# - 8083 portal-web: /healthz OK and host-specific HTML/CSS/JS checked
# - 8081 demo API healthy
# - /var/www/html/bom-inventory/index.html (admin) present
# - /var/www/html/bom-inventory/customer.html (public QR) present
# - /var/www/html/bom-inventory/customer-assets/assets/ populated
# - 8080 legacy Portal stays running for still-unmigrated admin/OAuth/HS
#
# Exact routing and location priority matter. This is a staged config,
# NOT permission to shut down the legacy Portal.

# React login and admin SPA (preserve existing public 443 URL).
location = /bom-inventory {
    return 308 /bom-inventory/;
}

# Dedicated public QR bundle; generated with npm run build:customer.
location ^~ /bom-inventory/customer-assets/ {
    root /var/www/html;
    try_files $uri =404;
    expires 1h;
}

# Keep existing public QR URLs, but use independent small customer bundle.
location ^~ /bom-inventory/shop/ {
    root /var/www/html;
    try_files $uri /bom-inventory/customer.html;
}

# Demo admin React SPA. React login: /bom-inventory/login.
location ^~ /bom-inventory/ {
    root /var/www/html;
    index index.html;
    try_files $uri $uri/ /bom-inventory/index.html;
}

# Spring Boot demo already uses server.servlet.context-path=/sapi.
# No URI rewrite: preserve the incoming /sapi/ prefix.
# If 8082 order-buffer service is already live and separately routed, keep
# its tested more-specific /sapi/shop/... Nginx routes ABOVE this catch-all.
location ^~ /sapi/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_redirect off;
}

# TRANSITION ONLY: old Portal 8080 routes still needed until migrated.
# IMPORTANT: the older regex location ~ ^/(auth|bom|admin)/ must be removed;
# it incorrectly sent Portal admin routes to demo.
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
}
location ^~ /api/internal/tariff/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
}
# Add other VERIFIED legacy OAuth callbacks/admin routes individually before
# switching root. Do not reroute unknown API endpoints to a public renderer.

# Public tenant websites use standalone Thymeleaf.
location / {
    proxy_pass http://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_redirect off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
}

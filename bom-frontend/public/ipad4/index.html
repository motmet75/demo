<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>BOM Shop Orders - iPad</title>
  <style>
    html, body { margin: 0; padding: 0; background: #eef1f4; color: #20252b; font: 18px Arial, sans-serif; }
    * { -webkit-box-sizing: border-box; box-sizing: border-box; }
    .bar { background: #174a75; color: #fff; padding: 14px 16px; overflow: hidden; }
    .bar h1 { float: left; margin: 4px 0; font-size: 22px; }
    .bar .right { float: right; }
    .page { width: 96%; max-width: 980px; margin: 14px auto; }
    .panel, .order { background: #fff; border: 1px solid #cbd2d9; border-radius: 7px; padding: 16px; margin-bottom: 14px; }
    .login { max-width: 440px; margin: 45px auto; }
    h2, h3, p { margin-top: 0; }
    label { display: block; margin: 13px 0 5px; font-weight: bold; }
    input { display: block; width: 100%; height: 48px; padding: 8px 10px; border: 1px solid #929ca6; border-radius: 5px; font-size: 18px; background: #fff; }
    button { min-height: 46px; padding: 8px 16px; border: 0; border-radius: 5px; background: #1769aa; color: #fff; font-size: 18px; font-weight: bold; }
    button:active { background: #0d4775; }
    button.secondary { background: #65727e; }
    button.small { min-height: 38px; padding: 6px 12px; font-size: 15px; }
    .wide { width: 100%; margin-top: 18px; }
    .message { display: none; padding: 11px; margin: 12px 0; border-radius: 5px; background: #ffe3e3; color: #8b1111; }
    .notice { background: #fff5c7; color: #574800; }
    .muted { color: #68727c; font-size: 15px; }
    .status { float: right; padding: 5px 8px; border-radius: 4px; background: #dde8f2; font-size: 14px; font-weight: bold; }
    .order-title { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
    .meta { margin-bottom: 10px; color: #525d66; }
    .items { margin: 8px 0 0; padding: 0; list-style: none; border-top: 1px solid #dde1e5; }
    .items li { padding: 9px 2px; border-bottom: 1px solid #e4e7ea; }
    .qty { display: inline-block; min-width: 45px; font-weight: bold; color: #174a75; }
    .total { margin-top: 12px; text-align: right; font-size: 20px; font-weight: bold; }
    .order-actions { margin-top: 14px; overflow: hidden; }
    .order-actions button { float: left; width: 48%; margin-right: 2%; min-height: 58px; }
    .order-actions button.pay { background: #168447; }
    .paid { color: #168447; font-size: 15px; font-weight: bold; text-align: right; margin-top: 10px; }
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background: #17212b; background: rgba(10, 20, 30, .94); }
    .modal-card { width: 92%; max-width: 540px; margin: 24px auto; padding: 18px; background: #fff; border-radius: 9px; text-align: center; }
    .modal-title { margin: 0 0 4px; color: #174a75; font-size: 30px; }
    .modal-order { margin: 0 0 10px; color: #20252b; font-size: 54px; font-weight: bold; }
    .qr-frame { min-height: 280px; padding: 10px; border: 3px solid #dce8f1; border-radius: 8px; background: #fff; }
    .qr-frame img { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto; }
    .pay-amount { margin: 12px 0 3px; color: #168447; font-size: 34px; font-weight: bold; }
    .close-button { width: 100%; margin-top: 15px; background: #4d5963; }
    .toolbar { margin-bottom: 14px; overflow: hidden; }
    .toolbar button { width: 48%; margin-right: 2%; min-height: 58px; }
    .toolbar .queue { background: #7a4aa0; }
    .item-row { overflow: hidden; min-height: 70px; }
    .item-photo { float: left; width: 64px; height: 64px; margin-right: 10px; border-radius: 6px; border: 1px solid #d5dce2; object-fit: cover; background: #f2f4f6; }
    .item-info { overflow: hidden; }
    .item-money { float: right; color: #168447; font-weight: bold; }
    .flow-actions { margin-top: 12px; }
    .flow-actions button { width: 100%; background: #d87812; }
    .form-modal .modal-card { max-width: 850px; text-align: left; }
    select { width: 100%; height: 48px; padding: 7px; border: 1px solid #929ca6; border-radius: 5px; background: #fff; font-size: 18px; }
    .member-result { padding: 10px; margin-top: 8px; border-radius: 5px; background: #e9f6ed; color: #176334; }
    .menu-grid { max-height: 280px; overflow: auto; margin-top: 10px; border: 1px solid #d5dce2; }
    .menu-choice { overflow: hidden; padding: 9px; border-bottom: 1px solid #d5dce2; }
    .menu-choice img { float: left; width: 58px; height: 58px; margin-right: 9px; object-fit: cover; }
    .menu-choice button { float: right; min-height: 42px; }
    .cart-line { overflow: hidden; padding: 9px 0; border-bottom: 1px solid #d5dce2; }
    .cart-line button { float: right; min-height: 38px; padding: 4px 11px; background: #a33b35; }
    .form-buttons { overflow: hidden; margin-top: 16px; }
    .form-buttons button { width: 48%; margin-right: 2%; }
    .clear { clear: both; }
    #ordersView, #contextBox, #otpBox { display: none; }
    @media (max-width: 600px) { .page { width: 94%; } .bar h1 { float: none; } .bar .right { float: none; margin-top: 10px; } }
  </style>
</head>
<body>
  <div id="loginView" class="page">
    <div class="panel login">
      <h2>Đăng nhập BOM</h2>
      <p class="muted">Phiên bản đơn giản cho iPad cũ</p>
      <div id="loginMessage" class="message"></div>
      <form id="loginForm">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" required>
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="loginButton" class="wide" type="submit">Đăng nhập</button>
      </form>
      <form id="otpBox">
        <label for="otp">Mã xác minh</label>
        <input id="otp" name="otp" type="tel" inputmode="numeric" autocomplete="one-time-code" required>
        <button id="otpButton" class="wide" type="submit">Xác minh</button>
        <button id="backButton" class="wide secondary" type="button">Quay lại</button>
      </form>
    </div>
  </div>

  <div id="ordersView">
    <div class="bar">
      <h1>Shop Orders</h1>
      <div class="right">
        <button id="refreshButton" class="small" type="button">Làm mới</button>
        <button id="logoutButton" class="small secondary" type="button">Đăng xuất</button>
      </div>
      <div class="clear"></div>
    </div>
    <div class="page">
      <div id="ordersMessage" class="message"></div>
      <div id="contextBox" class="panel">
        <h3>Chọn cửa hàng</h3>
        <p class="muted">Tài khoản chưa có cửa hàng mặc định. Nhập ID để tiếp tục.</p>
        <label for="tenantId">Tenant ID</label>
        <input id="tenantId" type="text" autocapitalize="off">
        <label for="companyId">Company ID</label>
        <input id="companyId" type="text" autocapitalize="off">
        <button id="saveContextButton" class="wide" type="button">Mở đơn hàng</button>
      </div>
      <div class="toolbar">
        <button id="newOrderButton" type="button">+ Tạo đơn mới</button>
        <button id="queueQrButton" class="queue" type="button">QR xếp hàng</button>
      </div>
      <div id="orders"></div>
    </div>
  </div>

  <div id="qrModal" class="modal">
    <div class="modal-card">
      <h2 id="qrTitle" class="modal-title">Mã QR</h2>
      <div id="qrOrder" class="modal-order"></div>
      <p id="qrHelp" class="muted"></p>
      <div id="qrError" class="message"></div>
      <div id="qrFrame" class="qr-frame"><p>Đang tạo mã QR...</p></div>
      <div id="qrAmount" class="pay-amount"></div>
      <div id="qrReference" class="muted"></div>
      <button id="newQueueQrButton" class="wide queue" style="display:none;background:#7a4aa0" type="button">Tạo Queue QR mới</button>
      <button id="closeQrButton" class="close-button" type="button">Đóng</button>
    </div>
  </div>

  <div id="orderModal" class="modal form-modal">
    <div class="modal-card">
      <h2 class="modal-title">Tạo đơn tại quầy</h2>
      <div id="formError" class="message"></div>
      <label for="customerPhone">Số điện thoại đầy đủ</label>
      <input id="customerPhone" type="tel" inputmode="tel" placeholder="Ví dụ: 0901234567">
      <button id="findCustomerButton" class="wide secondary" type="button">Tìm hội viên</button>
      <div id="memberResult"></div>
      <div id="newMemberFields" style="display:none">
        <label for="customerName">Tên hội viên mới</label>
        <input id="customerName" type="text" placeholder="Nhập họ tên">
        <p class="muted">Hội viên mới sẽ được tạo bằng số điện thoại trên khi lưu đơn.</p>
      </div>
      <label for="fulfillmentType">Hình thức nhận hàng</label>
      <select id="fulfillmentType"><option value="PICKUP">Mang đi</option><option value="DINE_IN">Dùng tại quán</option><option value="DELIVERY">Giao hàng</option></select>
      <label>Chọn món</label>
      <div id="menuChoices" class="menu-grid"><div class="menu-choice">Đang tải thực đơn...</div></div>
      <h3 style="margin-top:16px">Món đã chọn</h3>
      <div id="cartLines"><p class="muted">Chưa chọn món.</p></div>
      <div id="cartTotal" class="total">0 đ</div>
      <label for="paymentMethod">Thanh toán</label>
      <select id="paymentMethod"><option value="CASH">Tiền mặt</option><option value="BANK_QR">Chuyển khoản QR</option></select>
      <label for="orderNotes">Ghi chú</label>
      <input id="orderNotes" type="text" placeholder="Ghi chú cho đơn hàng">
      <div class="form-buttons">
        <button id="submitOrderButton" type="button">Tạo đơn</button>
        <button id="cancelOrderFormButton" class="secondary" type="button">Đóng</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    var user = null;
    var tenantId = '';
    var companyId = '';
    var mfaMethod = '';
    var orderById = {};
    var menuModels = [];
    var cart = [];
    var selectedCustomer = null;

    function byId(id) { return document.getElementById(id); }
    function text(value) { return value === null || typeof value === 'undefined' ? '' : String(value); }
    function escapeHtml(value) {
      return text(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeImage(value) {
      var src = text(value);
      if (src.indexOf('https://') === 0 || src.indexOf('http://') === 0 || src.indexOf('/') === 0 || src.indexOf('data:image/') === 0) return escapeHtml(src);
      return '';
    }
    function setBusy(id, busy, normalText) {
      var button = byId(id);
      button.disabled = busy;
      button.innerHTML = busy ? 'Đang xử lý...' : normalText;
    }
    function message(id, value, notice) {
      var box = byId(id);
      box.className = notice ? 'message notice' : 'message';
      box.innerHTML = escapeHtml(value);
      box.style.display = value ? 'block' : 'none';
    }
    function request(method, url, body, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      xhr.withCredentials = true;
      xhr.setRequestHeader('Accept', 'application/json');
      if (body !== null) xhr.setRequestHeader('Content-Type', 'application/json');
      if (tenantId) xhr.setRequestHeader('X-Tenant-Id', tenantId);
      if (companyId) xhr.setRequestHeader('X-Company-Id', companyId);
      xhr.setRequestHeader('X-Time-Zone', 'Asia/Ho_Chi_Minh');
      xhr.onreadystatechange = function () {
        var data = null;
        if (xhr.readyState !== 4) return;
        try { data = xhr.responseText ? JSON.parse(xhr.responseText) : null; } catch (ignore) { data = null; }
        callback(xhr.status, data);
      };
      xhr.onerror = function () { callback(0, null); };
      xhr.send(body === null ? null : JSON.stringify(body));
    }
    function errorText(status, data) {
      if (data && (data.message || data.error)) return data.message || data.error;
      if (status === 0) return 'Không thể kết nối máy chủ.';
      if (status === 401) return 'Phiên đăng nhập đã hết hạn.';
      return 'Có lỗi xảy ra (' + status + ').';
    }
    function saveContext() {
      try { localStorage.setItem('bom_ipad_context_v1', JSON.stringify({ tenantId: tenantId, companyId: companyId })); } catch (ignore) {}
    }
    function restoreContext() {
      var saved;
      try {
        saved = JSON.parse(localStorage.getItem('bom_ipad_context_v1') || '{}');
        tenantId = saved.tenantId || '';
        companyId = saved.companyId || '';
      } catch (ignore) {}
    }
    function chooseContext(authUser) {
      tenantId = authUser.assignedTenantId || authUser.lastTenantId || tenantId;
      companyId = authUser.assignedCompanyId || authUser.lastCompanyId || companyId;
      saveContext();
      byId('tenantId').value = tenantId;
      byId('companyId').value = companyId;
    }
    function showLogin() {
      byId('ordersView').style.display = 'none';
      byId('loginView').style.display = 'block';
      byId('loginForm').style.display = 'block';
      byId('otpBox').style.display = 'none';
      byId('password').value = '';
      byId('otp').value = '';
      mfaMethod = '';
    }
    function showOrders() {
      byId('loginView').style.display = 'none';
      byId('ordersView').style.display = 'block';
      if (!tenantId || !companyId) {
        byId('contextBox').style.display = 'block';
        byId('orders').innerHTML = '';
      } else {
        byId('contextBox').style.display = 'none';
        loadOrders();
      }
    }
    function finishLogin(authUser) {
      user = authUser || {};
      chooseContext(user);
      message('loginMessage', '', false);
      showOrders();
    }
    function formatMoney(value) {
      var n = Number(value || 0);
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' đ';
    }
    function formatDate(value) {
      var d = new Date(value);
      if (!value || isNaN(d.getTime())) return '';
      return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }
    function renderOrders(rows) {
      var html = '';
      var i, j, order, item, items, photo, actionLabel, actionName;
      orderById = {};
      if (!rows || !rows.length) {
        byId('orders').innerHTML = '<div class="panel">Chưa có đơn hàng.</div>';
        return;
      }
      for (i = 0; i < rows.length; i += 1) {
        order = rows[i] || {};
        orderById[order.id] = order;
        items = order.items || [];
        html += '<div class="order"><span class="status">' + escapeHtml(order.status) + '</span>';
        html += '<div class="order-title">Đơn #' + escapeHtml(order.orderNumber || order.dailySeq || order.orderCode) + '</div>';
        html += '<div class="meta">' + escapeHtml(order.tableName || order.fulfillmentType || '') + ' &middot; ' + escapeHtml(formatDate(order.createdAt)) + '</div>';
        if (order.customerName) html += '<div>Khách: ' + escapeHtml(order.customerName) + '</div>';
        html += '<ul class="items">';
        for (j = 0; j < items.length; j += 1) {
          item = items[j] || {};
          photo = safeImage(item.imageUrl);
          html += '<li class="item-row">' + (photo ? '<img class="item-photo" src="' + photo + '" alt="">' : '<span class="item-photo"></span>');
          html += '<div class="item-info"><span class="item-money">' + escapeHtml(formatMoney(item.lineTotal)) + '</span>';
          html += '<span class="qty">' + escapeHtml(item.quantity) + ' x</span> ' + escapeHtml(item.modelName || 'Món');
          html += '<br><span class="muted">' + escapeHtml(formatMoney(item.unitPrice)) + ' / món</span>';
          if (item.itemNotes) html += '<br><span class="muted">' + escapeHtml(item.itemNotes) + '</span>';
          html += '</div></li>';
        }
        html += '</ul><div class="total">' + escapeHtml(formatMoney(Math.max(0, Number(order.totalAmount || 0) - Number(order.discountAmount || 0)))) + '</div>';
        if (order.paymentStatus === 'PAID') html += '<div class="paid">ĐÃ THANH TOÁN</div>';
        html += '<div class="order-actions">';
        html += '<button type="button" data-action="track" data-id="' + escapeHtml(order.id) + '">QR theo dõi</button>';
        if (order.paymentStatus !== 'PAID' && order.status !== 'CANCELLED') {
          html += '<button type="button" class="pay" data-action="pay" data-id="' + escapeHtml(order.id) + '">QR thanh toán</button>';
        }
        html += '</div><div class="clear"></div>';
        actionName = ''; actionLabel = '';
        if (order.status === 'PENDING') { actionName = 'confirm'; actionLabel = 'Xác nhận đơn'; }
        else if (order.status === 'CONFIRMED') { actionName = 'prepare'; actionLabel = 'Bắt đầu chế biến'; }
        else if (order.status === 'PREPARING') { actionName = 'ready'; actionLabel = 'Món đã sẵn sàng'; }
        else if (order.status === 'READY' || order.status === 'PICKED_UP') { actionName = 'complete'; actionLabel = 'Hoàn tất đơn'; }
        if (actionName) html += '<div class="flow-actions"><button type="button" data-action="' + actionName + '" data-id="' + escapeHtml(order.id) + '">' + actionLabel + '</button></div>';
        html += '</div>';
      }
      byId('orders').innerHTML = html;
    }
    function openQr(title, order, help) {
      byId('qrTitle').innerHTML = escapeHtml(title);
      byId('qrOrder').innerHTML = '#' + escapeHtml(order.orderNumber || order.dailySeq || order.orderCode);
      byId('qrHelp').innerHTML = escapeHtml(help);
      byId('qrFrame').innerHTML = '<p>Đang tạo mã QR...</p>';
      byId('qrAmount').innerHTML = '';
      byId('qrReference').innerHTML = '';
      byId('newQueueQrButton').style.display = 'none';
      message('qrError', '', false);
      byId('qrModal').style.display = 'block';
      document.body.style.overflow = 'hidden';
    }
    function closeQr() {
      byId('qrModal').style.display = 'none';
      document.body.style.overflow = '';
    }
    function qrImage(source, alt) {
      if (!source) return '';
      if (source.indexOf('http://') === 0 || source.indexOf('https://') === 0 || source.indexOf('data:') === 0) {
        return '<img src="' + escapeHtml(source) + '" alt="' + escapeHtml(alt) + '">';
      }
      return '<img src="data:image/png;base64,' + escapeHtml(source) + '" alt="' + escapeHtml(alt) + '">';
    }
    function showTracking(order) {
      openQr('Theo dõi đơn hàng', order, 'Khách hàng quét mã này để xem trạng thái đơn');
      request('GET', '/sapi/shop/staff/orders/' + encodeURIComponent(order.id) + '/tag-qr', null, function (status, data) {
        if (status < 200 || status >= 300 || !data || !data.qrBase64) {
          byId('qrFrame').innerHTML = '';
          message('qrError', errorText(status, data), false);
          return;
        }
        byId('qrFrame').innerHTML = qrImage(data.qrBase64, 'QR theo dõi đơn hàng');
        byId('qrReference').innerHTML = escapeHtml(order.orderCode || '');
      });
    }
    function showPayment(order) {
      var amount = Math.max(0, Number(order.totalAmount || 0) - Number(order.discountAmount || 0));
      openQr('Thanh toán', order, 'Khách hàng mở ứng dụng ngân hàng và quét mã');
      byId('qrAmount').innerHTML = escapeHtml(formatMoney(amount));
      byId('qrReference').innerHTML = 'Nội dung: ' + escapeHtml(order.orderCode || '');
      if (order.paymentQr) {
        byId('qrFrame').innerHTML = qrImage(order.paymentQr, 'QR thanh toán');
        return;
      }
      request('GET', '/sapi/shop/staff/bank-config', null, function (status, data) {
        var url;
        if (status < 200 || status >= 300 || !data || !data.bankBin || !data.bankAccountNumber) {
          byId('qrFrame').innerHTML = '';
          message('qrError', status >= 200 && status < 300 ? 'Chưa cấu hình tài khoản ngân hàng.' : errorText(status, data), false);
          return;
        }
        url = 'https://img.vietqr.io/image/' + encodeURIComponent(data.bankBin) + '-' + encodeURIComponent(data.bankAccountNumber) + '-qr_only.png';
        url += '?amount=' + Math.round(amount) + '&addInfo=' + encodeURIComponent(order.orderCode || '') + '&accountName=' + encodeURIComponent(data.bankAccountName || '');
        byId('qrFrame').innerHTML = qrImage(url, 'VietQR thanh toán');
      });
    }
    function queueStorageKey() { return 'bom_ipad_queue_qr_' + tenantId + '_' + companyId; }
    function displayQueueQr(data) {
      openQr('Queue QR', { orderCode: 'XẾP HÀNG' }, 'Khách quét mã để chọn bàn, nhập tên và gọi món');
      byId('qrOrder').innerHTML = 'XẾP HÀNG';
      byId('qrFrame').innerHTML = qrImage(data.qrBase64, 'Queue QR');
      byId('qrReference').innerHTML = data.expiresAt ? 'Dùng đến: ' + escapeHtml(formatDate(data.expiresAt)) : '';
      byId('newQueueQrButton').style.display = 'block';
    }
    function openQueueQr(forceNew) {
      var saved = null;
      if (!forceNew) {
        try { saved = JSON.parse(localStorage.getItem(queueStorageKey()) || 'null'); } catch (ignore) {}
        if (saved && saved.qrBase64 && (!saved.expiresAt || new Date(saved.expiresAt).getTime() > new Date().getTime())) {
          displayQueueQr(saved);
          return;
        }
      }
      openQr('Queue QR', { orderCode: 'XẾP HÀNG' }, 'Đang tạo mã xếp hàng cho khách');
      byId('qrOrder').innerHTML = 'XẾP HÀNG';
      byId('newQueueQrButton').style.display = 'none';
      request('POST', '/sapi/shop/staff/queue-qr', { validDays: 30, forceNew: !!forceNew }, function (status, data) {
        if (status < 200 || status >= 300 || !data || !data.qrBase64) {
          byId('qrFrame').innerHTML = '';
          message('qrError', errorText(status, data), false);
          return;
        }
        try { localStorage.setItem(queueStorageKey(), JSON.stringify(data)); } catch (ignore) {}
        displayQueueQr(data);
      });
    }
    function closeOrderForm() { byId('orderModal').style.display = 'none'; document.body.style.overflow = ''; }
    function normalizePhone(value) { return text(value).replace(/[^0-9+]/g, '').replace(/^\+84/, '0'); }
    function renderMenu() {
      var html = '', i, model, photo;
      if (!menuModels.length) { byId('menuChoices').innerHTML = '<div class="menu-choice">Không có món đang bán.</div>'; return; }
      for (i = 0; i < menuModels.length; i += 1) {
        model = menuModels[i]; photo = safeImage(model.imageUrl || model.thumbnailUrl);
        html += '<div class="menu-choice">' + (photo ? '<img src="' + photo + '" alt="">' : '');
        html += '<button type="button" data-menu-id="' + escapeHtml(model.id) + '">+ Thêm</button>';
        html += '<strong>' + escapeHtml(model.modelName || model.name || 'Món') + '</strong><br><span class="item-money" style="float:none">' + escapeHtml(formatMoney(model.sellingPrice)) + '</span><div class="clear"></div></div>';
      }
      byId('menuChoices').innerHTML = html;
    }
    function renderCart() {
      var html = '', total = 0, i, line;
      if (!cart.length) { byId('cartLines').innerHTML = '<p class="muted">Chưa chọn món.</p>'; byId('cartTotal').innerHTML = '0 đ'; return; }
      for (i = 0; i < cart.length; i += 1) {
        line = cart[i]; total += Number(line.sellingPrice || 0) * line.quantity;
        html += '<div class="cart-line"><button type="button" data-remove-id="' + escapeHtml(line.id) + '">Xóa</button><strong>' + escapeHtml(line.quantity) + ' x ' + escapeHtml(line.modelName || line.name) + '</strong><br><span class="muted">' + escapeHtml(formatMoney(Number(line.sellingPrice || 0) * line.quantity)) + '</span></div>';
      }
      byId('cartLines').innerHTML = html;
      byId('cartTotal').innerHTML = formatMoney(total);
    }
    function openOrderForm() {
      cart = []; selectedCustomer = null;
      byId('customerPhone').value = ''; byId('customerName').value = ''; byId('orderNotes').value = '';
      byId('memberResult').innerHTML = ''; byId('newMemberFields').style.display = 'none';
      message('formError', '', false); renderCart();
      byId('orderModal').style.display = 'block'; document.body.style.overflow = 'hidden';
      request('GET', '/sapi/bom/models', null, function (status, data) {
        var list = data instanceof Array ? data : data && (data.data || data.items || data.content);
        menuModels = list instanceof Array ? list.filter(function (m) { return m.sellingPrice !== null && m.sellingPrice !== undefined && m.isActive !== false; }) : [];
        renderMenu();
      });
    }
    function findCustomer() {
      var phone = normalizePhone(byId('customerPhone').value);
      if (phone.length < 9) { message('formError', 'Vui lòng nhập đầy đủ số điện thoại.', false); return; }
      byId('customerPhone').value = phone; message('formError', '', false);
      request('GET', '/sapi/shop/staff/customers?q=' + encodeURIComponent(phone), null, function (status, data) {
        var list = data instanceof Array ? data : [], i, found = null;
        if (status < 200 || status >= 300) { message('formError', errorText(status, data), false); return; }
        for (i = 0; i < list.length; i += 1) if (normalizePhone(list[i].phone) === phone) { found = list[i]; break; }
        selectedCustomer = found;
        if (found) {
          byId('memberResult').innerHTML = '<div class="member-result">Hội viên: <strong>' + escapeHtml(found.name) + '</strong><br>' + escapeHtml(found.phone) + (found.points !== undefined ? ' · ' + escapeHtml(found.points) + ' điểm' : '') + '</div>';
          byId('newMemberFields').style.display = 'none';
        } else {
          byId('memberResult').innerHTML = '<div class="message notice" style="display:block">Chưa có hội viên với số này. Nhập tên để tạo mới.</div>';
          byId('newMemberFields').style.display = 'block';
        }
      });
    }
    function submitOrder() {
      var phone = normalizePhone(byId('customerPhone').value), name, body;
      if (!cart.length) { message('formError', 'Vui lòng chọn ít nhất một món.', false); return; }
      if (phone.length < 9) { message('formError', 'Vui lòng nhập và kiểm tra đầy đủ số điện thoại.', false); return; }
      name = selectedCustomer ? selectedCustomer.name : byId('customerName').value.replace(/^\s+|\s+$/g, '');
      if (!selectedCustomer && !name) { message('formError', 'Vui lòng nhập tên hội viên mới.', false); return; }
      setBusy('submitOrderButton', true, 'Tạo đơn'); message('formError', '', false);
      function createWithCustomer(customer) {
        body = { fulfillmentType: byId('fulfillmentType').value, tableId: null, customerName: customer.name, customerPhone: phone, paymentMethod: byId('paymentMethod').value, notes: byId('orderNotes').value || null, manualOrderNumber: null,
          items: cart.map(function (item) { return { modelId: item.id, quantity: item.quantity, selectedOptions: null, itemNotes: null, unitPriceOverride: Number(item.sellingPrice) || null, sideItems: [] }; }) };
        request('POST', '/sapi/shop/staff/orders', body, function (status, order) {
          if (status < 200 || status >= 300 || !order || !order.id) { setBusy('submitOrderButton', false, 'Tạo đơn'); message('formError', errorText(status, order), false); return; }
          request('PATCH', '/sapi/shop/staff/orders/' + encodeURIComponent(order.id) + '/customer', { customerId: customer.id }, function () {
            setBusy('submitOrderButton', false, 'Tạo đơn'); closeOrderForm(); loadOrders(); showTracking(order);
          });
        });
      }
      if (selectedCustomer) { createWithCustomer(selectedCustomer); return; }
      request('POST', '/sapi/shop/staff/customers', { name: name, phone: phone }, function (status, customer) {
        if (status < 200 || status >= 300 || !customer || !customer.id) { setBusy('submitOrderButton', false, 'Tạo đơn'); message('formError', errorText(status, customer), false); return; }
        selectedCustomer = customer; createWithCustomer(customer);
      });
    }
    function advanceOrder(order, action) {
      var labels = { confirm: 'xác nhận', prepare: 'bắt đầu chế biến', ready: 'đánh dấu sẵn sàng', complete: 'hoàn tất' };
      if (!window.confirm('Bạn chắc chắn muốn ' + labels[action] + ' đơn #' + (order.orderNumber || order.orderCode) + '?')) return;
      request('PATCH', '/sapi/shop/staff/orders/' + encodeURIComponent(order.id) + '/' + action, null, function (status, data) {
        if (status < 200 || status >= 300) { message('ordersMessage', errorText(status, data), false); return; }
        loadOrders();
      });
    }
    function loadOrders() {
      message('ordersMessage', 'Đang tải đơn hàng...', true);
      request('GET', '/sapi/shop/staff/orders', null, function (status, data) {
        if (status === 401) { showLogin(); message('loginMessage', 'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.', false); return; }
        if (status < 200 || status >= 300) { message('ordersMessage', errorText(status, data), false); return; }
        message('ordersMessage', '', false);
        renderOrders(data instanceof Array ? data : []);
      });
    }

    byId('loginForm').onsubmit = function () {
      setBusy('loginButton', true, 'Đăng nhập');
      message('loginMessage', '', false);
      request('POST', '/sapi/auth/login', { username: byId('username').value, password: byId('password').value }, function (status, data) {
        setBusy('loginButton', false, 'Đăng nhập');
        if (status >= 200 && status < 300 && data && data.authenticated) { finishLogin(data.user); return; }
        if (status >= 200 && status < 300 && data && data.mfaRequired) {
          mfaMethod = data.mfaMethod || 'email';
          byId('loginForm').style.display = 'none';
          byId('otpBox').style.display = 'block';
          message('loginMessage', data.message || 'Nhập mã xác minh.', true);
          byId('otp').focus();
          return;
        }
        message('loginMessage', errorText(status, data), false);
      });
      return false;
    };
    byId('otpBox').onsubmit = function () {
      var endpoint = mfaMethod === 'authenticator' ? '/sapi/auth/login-totp/verify' : '/sapi/auth/login-otp/verify';
      setBusy('otpButton', true, 'Xác minh');
      request('POST', endpoint, { otp: byId('otp').value }, function (status, data) {
        setBusy('otpButton', false, 'Xác minh');
        if (status >= 200 && status < 300 && data && data.authenticated) { finishLogin(data.user); return; }
        if (status >= 200 && status < 300 && data && data.mfaRequired) {
          mfaMethod = data.mfaMethod || mfaMethod;
          byId('otp').value = '';
          message('loginMessage', data.message || 'Nhập mã xác minh tiếp theo.', true);
          return;
        }
        message('loginMessage', errorText(status, data), false);
      });
      return false;
    };
    byId('backButton').onclick = showLogin;
    byId('refreshButton').onclick = loadOrders;
    byId('closeQrButton').onclick = closeQr;
    byId('newOrderButton').onclick = openOrderForm;
    byId('queueQrButton').onclick = function () { openQueueQr(false); };
    byId('newQueueQrButton').onclick = function () {
      if (window.confirm('Tạo Queue QR mới? Mã hiện tại sẽ không còn được hiển thị tại quầy.')) openQueueQr(true);
    };
    byId('cancelOrderFormButton').onclick = closeOrderForm;
    byId('findCustomerButton').onclick = findCustomer;
    byId('submitOrderButton').onclick = submitOrder;
    byId('menuChoices').onclick = function (event) {
      var target = event.target || event.srcElement, id, i, found = null;
      if (!target || target.tagName !== 'BUTTON') return;
      id = target.getAttribute('data-menu-id');
      for (i = 0; i < menuModels.length; i += 1) if (text(menuModels[i].id) === id) { found = menuModels[i]; break; }
      if (!found) return;
      for (i = 0; i < cart.length; i += 1) if (text(cart[i].id) === id) { cart[i].quantity += 1; renderCart(); return; }
      found.quantity = 1; cart.push(found); renderCart();
    };
    byId('cartLines').onclick = function (event) {
      var target = event.target || event.srcElement, id, i;
      if (!target || target.tagName !== 'BUTTON') return;
      id = target.getAttribute('data-remove-id');
      for (i = 0; i < cart.length; i += 1) if (text(cart[i].id) === id) { cart.splice(i, 1); break; }
      renderCart();
    };
    byId('orders').onclick = function (event) {
      var target = event.target || event.srcElement;
      var action;
      var order;
      while (target && target !== byId('orders') && target.tagName !== 'BUTTON') target = target.parentNode;
      if (!target || target.tagName !== 'BUTTON') return;
      action = target.getAttribute('data-action');
      order = orderById[target.getAttribute('data-id')];
      if (!order) return;
      if (action === 'track') showTracking(order);
      if (action === 'pay') showPayment(order);
      if (action === 'confirm' || action === 'prepare' || action === 'ready' || action === 'complete') advanceOrder(order, action);
    };
    byId('saveContextButton').onclick = function () {
      tenantId = byId('tenantId').value.replace(/^\s+|\s+$/g, '');
      companyId = byId('companyId').value.replace(/^\s+|\s+$/g, '');
      if (!tenantId || !companyId) { message('ordersMessage', 'Cần nhập Tenant ID và Company ID.', false); return; }
      saveContext();
      byId('contextBox').style.display = 'none';
      loadOrders();
    };
    byId('logoutButton').onclick = function () {
      request('POST', '/sapi/auth/logout', null, function () { user = null; showLogin(); });
    };

    restoreContext();
    request('GET', '/sapi/auth/me', null, function (status, data) {
      if (status >= 200 && status < 300 && data && data.authenticated) { finishLogin(data.user); } else { showLogin(); }
    });
  }());
  </script>
</body>
</html>

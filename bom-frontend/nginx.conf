server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Keep old iPads out of the React SPA. Every route in this namespace uses
    # the standalone ES5 page, including bookmarked paths such as shop-orders.
    location = /bom-inventory/ipad4 {
        return 302 /bom-inventory/ipad4/;
    }

    location ^~ /bom-inventory/ipad4/ {
        # Serve standalone ES5 iPad files such as menu.html directly, while
        # still falling back to the iPad orders page for bookmarked subpaths.
        try_files $uri $uri/ /bom-inventory/ipad4/index.html =404;
    }

    location /bom-inventory/ {
        try_files $uri $uri/ /bom-inventory/index.html;
    }

    location / {
        try_files $uri $uri/ /bom-inventory/index.html;
    }
}

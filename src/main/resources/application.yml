spring:
  config:
    import: "optional:file:./secrets/application-secrets.properties"
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/anhmedia}"
    username: "${SPRING_DATASOURCE_USERNAME:postgres}"
    password: "${SPRING_DATASOURCE_PASSWORD:}"
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  session:
    timeout: 30m
    data:
      redis:
        namespace: "${SPRING_SESSION_REDIS_NAMESPACE:anhmedia:http-session}"
        # OTP/session objects are mutated after getAttribute(); persist those mutations too.
        save-mode: on-get-attribute
  mail:
    host: "${SES_SMTP_HOST:email-smtp.ap-northeast-2.amazonaws.com}"
    port: "${SES_SMTP_PORT:587}"
    username: "${SES_SMTP_USERNAME:}"
    password: "${SES_SMTP_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID:}"
            client-secret: "${GOOGLE_CLIENT_SECRET:}"
            scope: profile,email
server:
  port: "${PORT:8081}"
  servlet:
    context-path: /sapi
  forward-headers-strategy: framework
app:
  login:
    # Password login succeeds without an email OTP unless explicitly enabled.
    email-otp-required: "${LOGIN_EMAIL_OTP_REQUIRED:false}"
  mail:
    from: "${MAIL_FROM:services@anhmedia.vn}"
vin-hoadon:
  enabled: "${VIN_HOADON_ENABLED:false}"
  base-url: "${VIN_HOADON_BASE_URL:https://ws.vin-hoadon.com}"
  connect-timeout-seconds: "${VIN_HOADON_CONNECT_TIMEOUT_SECONDS:10}"
  request-timeout-seconds: "${VIN_HOADON_REQUEST_TIMEOUT_SECONDS:30}"
  master-key: "${VIN_HOADON_MASTER_KEY:}"
  relay:
    enabled: "${VIN_HOADON_RELAY_ENABLED:false}"
    extension-id: "${VIN_HOADON_RELAY_EXTENSION_ID:}"
    secret: "${VIN_HOADON_RELAY_SECRET:}"
    timeout-seconds: "${VIN_HOADON_RELAY_TIMEOUT_SECONDS:120}"
portal-content:
  # Comma-separated server-side datasource directories. The second default
  # lets a local demo checkout reuse the sibling Portal project's tenant files.
  tenant-config-dirs: "${PORTAL_TENANT_CONFIG_DIRS:./tenants/atRuntime,../portal/tenants/atRuntime}"

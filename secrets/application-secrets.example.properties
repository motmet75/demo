# Copy this file to secrets/application-secrets.properties on the server.
# Never commit the real credential file.
SES_SMTP_USERNAME=YOUR_AMAZON_SES_SMTP_USERNAME
SES_SMTP_PASSWORD=YOUR_AMAZON_SES_SMTP_PASSWORD

# Optional overrides:
SES_SMTP_HOST=email-smtp.ap-northeast-2.amazonaws.com
SES_SMTP_PORT=587
MAIL_FROM=services@anhmedia.vn

# OCR (server-side; choose off, tesseract or google)
invoice-desk.ocr=off
# invoice-desk.google-credentials=C:/secure/google-vision-service-account.json
# invoice-desk.tesseract-path=C:/Program Files/Tesseract-OCR/tesseract.exe
# invoice-desk.tesseract-languages=vie+eng
# Optional absolute path to a JSON array of {"from":"VC","to":"..."} phrase rules.
# Defaults: VC CL -> vận chuyển Cát Lái; VC -> vận chuyển.
# invoice-desk.phrase-rules=C:/secure/invoice-phrase-rules.json
# Optional direct backend TLS; use an absolute file URI:
# server.ssl.enabled=true
# server.ssl.key-store=file:/etc/anhmedia/tls/server.p12
# server.ssl.key-store-password=YOUR_KEYSTORE_PASSWORD
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=server
